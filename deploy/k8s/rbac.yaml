apiVersion: v1
kind: ServiceAccount
metadata:
  name: clawhost
  namespace: clawhost
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: clawhost
  namespace: clawhost
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/exec", "pods/log", "services", "persistentvolumeclaims", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: clawhost
  namespace: clawhost
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: clawhost
subjects:
  - kind: ServiceAccount
    name: clawhost
    namespace: clawhost
